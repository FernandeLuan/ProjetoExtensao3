<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migração v2 | Marlon Barber</title>
<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#f5f5f5;margin:0;padding:24px}main{max-width:620px;margin:auto;background:#181b21;border:1px solid #2b3039;border-radius:16px;padding:20px}h1{font-size:1.35rem}p{color:#b8bec9;line-height:1.55}label{display:block;margin:18px 0 8px}select,button{width:100%;padding:13px;border-radius:10px;font-size:1rem}select{background:#11141a;color:#fff;border:1px solid #39404c}button{border:0;background:#2563eb;color:#fff;font-weight:700;margin-top:16px}button:disabled{opacity:.5}.status{margin-top:18px;padding:12px;border-radius:10px;background:#11141a;white-space:pre-wrap}.warn{color:#fbbf24}</style>
</head>
<body>
<main>
<h1>Migração segura para v2.0</h1>
<p>Utilitário opcional para vincular atendimentos antigos a um profissional. Ele <strong>não recalcula valores, taxas ou repasses antigos</strong>.</p>
<p class="warn">Use apenas depois de publicar as novas regras e somente no ambiente correto.</p>
<label for="profissional">Atribuir registros sem profissional para:</label>
<select id="profissional"><option>Carregando...</option></select>
<button id="btnAnalisar" type="button">Analisar registros</button>
<button id="btnMigrar" type="button" disabled>Migrar registros encontrados</button>
<div id="status" class="status">Aguardando autenticação...</div>
<p><a href="dashboard.html" style="color:#7aa7ff">Voltar ao dashboard</a></p>
</main>
<script type="module" src="js/migrar-v2.js?v=6.1"></script>
</body>
</html>
