<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Profissional | Sr NK</title>
<link href="./manifest.webmanifest" rel="manifest"/>
<meta content="#0F1115" name="theme-color"/>
<link href="../icons/icon-192.png?v=11.0" rel="apple-touch-icon"/>
<link href="../css/style.css" rel="stylesheet"/>
<link href="../css/login.css?v=11.0" rel="stylesheet"/>
<link href="../js/firebase-init.js?v=11.0" rel="modulepreload"/>
<link href="../js/login.js?v=11.0" rel="modulepreload"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link crossorigin="" href="https://www.gstatic.com" rel="preconnect"/>
<link crossorigin="" href="https://identitytoolkit.googleapis.com" rel="preconnect"/>
</head>
<body data-login-area="profissional">
<main class="login-shell">
<a aria-label="Voltar ao site Sr NK" class="login-brand" href="../index.html">
<img alt="Logo Sr NK" src="../Fotos/Sr.NK.jpg"/>
<span>Sr NK</span>
</a>
<section class="login-card" aria-labelledby="loginTitulo">
<div class="login-area-icon"><i class="fas fa-scissors"></i></div>
<div class="login-heading">
<h1 id="loginTitulo">Área profissional</h1>
<p>Entre com sua conta para continuar</p>
</div>
<form id="loginForm" novalidate>
<label class="login-field">
<span>E-mail</span>
<div class="input-group"><i class="fas fa-envelope"></i><input autocomplete="username" id="usuario" placeholder="seu@email.com" required type="email"/></div>
</label>
<label class="login-field">
<span>Senha</span>
<div class="input-group senha-group"><i class="fas fa-lock"></i><input autocomplete="current-password" id="senha" placeholder="Digite sua senha" required type="password"/><button aria-label="Mostrar ou ocultar senha" class="toggle-senha" type="button"><i class="fas fa-eye"></i></button></div>
</label>
<div class="login-actions-row"><a class="link-esqueci" href="#" id="btnEsqueciSenha">Esqueci minha senha</a></div>
<button class="btn-login" type="submit"><span class="btn-text">Entrar</span><span class="loader"></span></button>
</form>
<p aria-live="polite" id="erroLogin"></p>
<div class="login-session-note"><i class="fas fa-lock"></i><span>Sessão exclusiva desta aba</span></div>
<a class="voltar-site" href="../index.html"><i class="fas fa-arrow-left"></i> Voltar para o site</a>
</section>
</main>
<script defer src="../js/mobile-interactions.js?v=11.0"></script>
<script src="../js/login.js?v=11.0" type="module"></script>
<script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../service-worker.js").catch(console.warn));</script>
</body>
</html>
