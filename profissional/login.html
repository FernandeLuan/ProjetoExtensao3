<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Profissional | Sr NK</title>
<link href="./manifest.webmanifest" rel="manifest"/>
<meta content="#0F1115" name="theme-color"/>
<link href="../icons/icon-192.png" rel="apple-touch-icon"/>
<link href="../css/style.css" rel="stylesheet"/>
<link href="../css/login.css?v=9.3" rel="stylesheet"/>
<link href="../js/firebase-init.js?v=9.3" rel="modulepreload"/>
<link href="../js/login.js?v=9.3" rel="modulepreload"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"/>
<link crossorigin="" href="https://www.gstatic.com" rel="preconnect"/>
<link crossorigin="" href="https://identitytoolkit.googleapis.com" rel="preconnect"/>
</head>
<body data-login-area="profissional">
<header class="header">
<div class="container header-container">
<div class="logo-container">
<a class="logo-link" href="../index.html"><img alt="Sr NK" class="logo-foto" src="../Fotos/teste1.jpeg"/></a>
<a class="logo-link" href="../index.html"><h1 class="logo">Sr NK</h1></a>
</div>
</div>
</header>
<section class="login-page">
<div class="login-card">
<i class="fas fa-user login-icon"></i>
<h2>Área Profissional</h2>
<p class="login-sub">Entre com sua conta da equipe</p>
<form id="loginForm">
<div class="input-group"><i class="fas fa-user"></i><input autocomplete="username" id="usuario" placeholder="E-mail" required type="email"/></div>
<div class="input-group senha-group"><i class="fas fa-lock"></i><input autocomplete="current-password" id="senha" placeholder="Senha" required type="password"/><button aria-label="Mostrar ou ocultar senha" class="toggle-senha" type="button"><i class="fas fa-eye"></i></button></div>
<div class="esqueci-senha-container"><a class="link-esqueci" href="#" id="btnEsqueciSenha">Esqueci minha senha</a></div>
<button class="btn-login" type="submit"><span class="btn-text">Entrar na área profissional</span><span class="loader"></span></button>
</form>
<p id="erroLogin"></p>
<p class="login-footer">🔒 Sessão exclusiva desta aba</p>
<a class="voltar-site" href="../index.html">Voltar para o site</a>
</div>
</section>
<script defer src="../js/mobile-interactions.js?v=9.3"></script>
<script src="../js/login.js?v=9.3" type="module"></script>
<script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("../service-worker.js").catch(console.warn));</script>
</body>
</html>
