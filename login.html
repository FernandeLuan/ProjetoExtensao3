<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | Sr NK</title>
<script>
(function(){
  const p=new URLSearchParams(location.search);
  const area=p.get('destino')==='admin'?'admin':'profissional';
  p.delete('destino');
  const q=p.toString();
  location.replace(`./${area}/login.html${q?`?${q}`:''}`);
})();
</script>
</head>
<body></body>
</html>
