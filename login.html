<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área da equipe | Sr NK</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1115">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css?v=8.28">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header class="header">
<div class="container header-container">

<div class="logo-container">
<a href="index.html" class="logo-link">
<img src="Fotos/teste1.jpeg" class="logo-foto" alt="Sr NK">
</a>

<a href="index.html" class="logo-link">
<h1 class="logo">Sr NK</h1>
</a>
</div>

</div>
</header>

<section class="login-page">

<div class="login-card">

<i class="fas fa-user-lock login-icon"></i>

<h2>Área da equipe</h2>

<p class="login-sub">
Acesse o sistema da barbearia
</p>

<form id="loginForm">

<div class="input-group">
<i class="fas fa-user"></i>
<input type="email" id="usuario" placeholder="E-mail" autocomplete="username" required>
</div>

<div class="input-group senha-group">
    <i class="fas fa-lock"></i>
    <input 
        type="password" 
        id="senha" 
        placeholder="Senha" 
        autocomplete="current-password" 
        required
    >
    <button
        type="button"
        class="toggle-senha"
        aria-label="Mostrar ou ocultar senha"
    >
        <i class="fas fa-eye"></i>
    </button>
</div>
<div class="esqueci-senha-container">
        <a href="#" id="btnEsqueciSenha" class="link-esqueci">Esqueci minha senha</a>
    </div>

<button type="submit" class="btn-login">
<span class="btn-text">Entrar</span>
<span class="loader"></span>
</button>

</form>

<p id="erroLogin"></p>

<p class="login-footer">
🔒 Acesso restrito à equipe
</p>

<a href="index.html" class="voltar-site">
Voltar para o site
</a>

</div>

</section>

<script src="js/mobile-interactions.js?v=8.28" defer></script>
<script type="module" src="js/login.js?v=8.28"></script>
<script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(console.warn));</script>
</body>
</html>
